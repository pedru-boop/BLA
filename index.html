const YEAR_LIST = Object.keys(YEARS).map(Number).sort((a,b)=>a-b);

/* ======================= HELPERS ======================= */
const fmt = (n, d=0) => n == null ? "-" : n.toLocaleString("th-TH", { minimumFractionDigits:d, maximumFractionDigits:d });
const fmtCompact = (n) => {
  if (n == null) return "-";
  if (Math.abs(n) >= 1e6) return (n/1e6).toFixed(2) + "M";
  if (Math.abs(n) >= 1e3) return (n/1e3).toFixed(0) + "K";
  return fmt(n);
};

function yearSummary(y) {
  const d = YEARS[y];
  let credit=0, policies=0, sumInsured=0, premium=0, commission=0, aumLast=null, monthsCount=0, direct=0, team30=0, commOrd=0, commLbdu=0;
  d.m.forEach(row => {
    if (!row) return;
    credit += row[0]||0; policies += row[1]||0; sumInsured += row[2]||0; premium += row[3]||0; commission += row[6]||0;
    direct += row[7]||0; team30 += row[8]||0; commOrd += row[9]||0; commLbdu += row[10]||0;
    if (row[5]!=null) aumLast = row[5];
    monthsCount++;
  });
  const quotaTotal = d.quota * monthsCount;
  const pct = quotaTotal>0 ? ((credit-quotaTotal)/quotaTotal*100) : 0;
  return { credit, policies, sumInsured, premium, commission, aum:aumLast, pct, quota:d.quota, monthsCount, position:d.position, direct, team30, commOrd, commLbdu };
}

  const s = yearSummary(y);
  const total = s.direct + s.team30;
  return {

/* ======================= UI ATOMS ======================= */
function KpiCard({ label, value, sub, tone="blue", onClick, breakdown }) {
  const bg = tone==="green" ? C.greenPale : tone==="navy" ? C.navy : tone==="teal" ? C.tealPale : C.skyPale;
  const border = tone==="green" ? C.green : tone==="navy" ? C.navy : tone==="teal" ? C.teal : C.blue;
  const text = tone==="navy" ? C.white : C.navy;
  const subColor = tone==="navy" ? C.skyLight : C.sub;
  return (
    <div onClick={onClick} style={{
      background: bg, borderRadius: 18, padding: "16px 18px",
      border: `2px solid ${border}`, minWidth: 0, flex: "1 1 150px",
      cursor: onClick ? "pointer" : "default"
    }}>
      <div style={{ fontSize: 14, fontWeight: 600, color: subColor, marginBottom: 6, whiteSpace:"nowrap" }}>{label}</div>
      <div style={{ fontSize: 24, fontWeight: 800, color: text, lineHeight: 1.15, wordBreak:"break-word" }}>{value}</div>
      {sub && <div style={{ fontSize: 13, fontWeight: 600, marginTop: 4, color: subColor }}>{sub}</div>}
      {breakdown && (
        <div style={{ fontSize: 12, fontWeight: 600, marginTop: 6, paddingTop: 6, borderTop: `1px dashed ${tone==="navy"?"rgba(255,255,255,0.25)":C.skyLight}`, color: subColor, lineHeight: 1.7 }}>
          {breakdown}
        </div>
      )}
    </div>
  );
}

function SectionTitle({ children, dot=C.blue }) {
  return (
    <div style={{ display:"flex", alignItems:"center", gap:10, margin:"6px 0 12px" }}>

    </div>

}

function Note({ children }) {

      fontSize:12.5, color:C.sub, background:C.skyPale, borderRadius:12,

    }}>{children}</div>

}

function Card({ children, style }) {

    <div style={{
      background: C.white, borderRadius: 22, padding: "18px 14px 8px",

          </div>
          <Note>
            <b>สูตร:</b> เครดิต = ค่านายหน้า (ผลงานตัวแทนตรง) + เครดิตในทีม 30% (ผลงานทีมในสังกัด) — ตรวจสอบแล้วว่าตัวเลขสองคอลัมน์นี้บวกกันเท่ากับเครดิตรวมทุกเดือน
          </Note>
          <div style={{ display:"flex", gap:16, marginTop:10, fontSize:13, fontWeight:700 }}>
            <span style={{ color:C.blue }}>■ ตัวแทนตรง (ค่านายหน้า)</span>
            <span style={{ color:C.green }}>■ ทีมงาน (เครดิต 30%)</span>
          </div>
        </Card>

        {/* ===================== YEAR-OVER-YEAR COMPARISON ===================== */}
        <Card>
          <SectionTitle dot={C.blue}>เปรียบเทียบผลงานรายปี</SectionTitle>
          <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap", marginBottom:16 }}>
            <select value={compareA} onChange={e=>setCompareA(Number(e.target.value))} style={yearSelectStyle}>
              {YEAR_LIST.map(y => <option key={y} value={y}>ปี {y}</option>)}
            </select>
            <span style={{ fontWeight:800, color:C.sub, fontSize:18 }}>→</span>
            <select value={compareB} onChange={e=>setCompareB(Number(e.target.value))} style={yearSelectStyle}>
              {YEAR_LIST.map(y => <option key={y} value={y}>ปี {y}</option>)}
            </select>
            <button onClick={()=>{ const t=compareA; setCompareA(compareB); setCompareB(t); }} style={{
              padding:"9px 14px", borderRadius:10, fontWeight:700, fontSize:13, cursor:"pointer",
              border:`2px solid ${C.navy}`, background:C.navy, color:C.white
            }}>สลับ</button>
          </div>

          <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
            {compareRows.map((r,i) => {
              const up = r.delta > 0.0001, down = r.delta < -0.0001;
              const deltaColor = up ? C.green : down ? C.red : C.sub;
              const arrow = up ? "▲" : down ? "▼" : "•";
              return (
                <div key={i} style={{
                  background: i%2? C.skyPale : C.white, borderRadius:14, padding:"12px 14px",
                  border:`1.5px solid ${C.skyLight}`
                }}>
                  <div style={{ fontSize:13.5, fontWeight:800, color:C.navy, marginBottom:6 }}>{r.label}</div>
                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", flexWrap:"wrap", gap:8 }}>
                    <div style={{ fontSize:13, color:C.sub, fontWeight:600 }}>
                      ปี {compareA}: <b style={{ color:C.ink }}>{r.unit==="฿" ? "฿"+fmt(r.a) : fmt(r.a,r.isPct?1:0)+(r.unit==="%"?"%":" "+r.unit)}</b>
                      {"  →  "}
                      ปี {compareB}: <b style={{ color:C.ink }}>{r.unit==="฿" ? "฿"+fmt(r.b) : fmt(r.b,r.isPct?1:0)+(r.unit==="%"?"%":" "+r.unit)}</b>
                    </div>
                    <div style={{
                      fontSize:14, fontWeight:800, color:deltaColor, background: up?C.greenPale:down?"#FBEAE9":C.skyPale,
                      borderRadius:99, padding:"4px 10px", whiteSpace:"nowrap"
                    }}>
                      {arrow} {r.delta>=0?"+":""}{r.unit==="฿" ? fmtCompact(r.delta) : fmt(r.delta, r.isPct?1:0)}{r.unit==="%"?"pt":""}
                      {r.deltaPct!=null && <span style={{ opacity:0.85 }}> ({r.deltaPct>=0?"+":""}{fmt(r.deltaPct,1)}%)</span>}
                    </div>
                  </div>
                  {r.key==="commission" && (
                    <div style={{ fontSize:11.5, color:C.sub, fontWeight:600, marginTop:6, paddingTop:6, borderTop:`1px dashed ${C.skyLight}` }}>
                      สามัญ: ปี {compareA} ฿{fmt(dataA.commOrd)} → ปี {compareB} ฿{fmt(dataB.commOrd)}
                      &nbsp;·&nbsp; LBDU: ปี {compareA} ฿{fmt(dataA.commLbdu)} → ปี {compareB} ฿{fmt(dataB.commLbdu)}
                    </div>
                  )}
                </div>
              );
            })}
          </div>
          <Note>เปรียบเทียบยอดรวมทั้งปี (ปี 2569 นับเฉพาะเดือนที่มีข้อมูลถึงปัจจุบัน) · ▲ สีเขียว = เพิ่มขึ้น · ▼ สีแดง = ลดลง</Note>
        </Card>

        {/* ===================== AUM — SEPARATE FROM INSURANCE ===================== */}
        <Card style={{ borderTop:`4px solid ${C.teal}` }}>
          <SectionTitle dot={C.teal}>AUM กองทุนรวม (แยกจากผลงานประกัน)</SectionTitle>
          <Note>AUM คือมูลค่าทรัพย์สินภายใต้การบริหารจากธุรกิจ<b>กองทุนรวม</b> ไม่เกี่ยวกับเบี้ย/ทุนประกันชีวิต จึงแสดงแยกไว้ต่างหากในหัวข้อนี้</Note>
          <div style={{ width:"100%", height:230, marginTop:12 }}>
            <ResponsiveContainer>
              <AreaChart data={aumTimeline} margin={{ top:6, right:8, left:-14, bottom:0 }}>
                <defs>
                  <linearGradient id="aumFill" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor={C.teal} stopOpacity={0.5}/>
                    <stop offset="100%" stopColor={C.teal} stopOpacity={0.03}/>
                  </linearGradient>
                </defs>
                <CartesianGrid stroke={C.tealPale} vertical={false} />
                <XAxis dataKey="label" tick={{ fontSize:10, fill:C.sub }} axisLine={{stroke:C.tealPale}} tickLine={false}
                  interval={11} />
                <YAxis tick={{ fontSize:11, fill:C.sub }} tickFormatter={fmtCompact} axisLine={false} tickLine={false} width={54} domain={['auto','auto']} />
                <Tooltip content={<CustomTooltip />} />
                <Area type="monotone" dataKey="aum" name="AUM" stroke={C.teal} strokeWidth={2.5} fill="url(#aumFill)" />
              </AreaChart>
            </ResponsiveContainer>
          </div>
          <div style={{ fontSize:12, color:C.sub, textAlign:"center", marginTop:2, paddingBottom:8 }}>
            แนวโน้ม AUM ตั้งแต่เริ่มต้นโครงการ (ม.ค. 2558) จนถึงล่าสุด (ก.ค. 2569) — {aumTimeline.length} เดือน
          </div>
          <div style={{ display:"flex", flexWrap:"wrap", gap:10 }}>
            <KpiCard tone="teal" label="AUM ล่าสุด" value={"฿"+fmtCompact(aumTimeline[aumTimeline.length-1].aum)} sub={aumTimeline[aumTimeline.length-1].label} />
            <KpiCard tone="teal" label="AUM สูงสุดตลอดกาล" value={"฿"+fmtCompact(Math.max(...aumTimeline.map(a=>a.aum)))}
              sub={aumTimeline.find(a=>a.aum===Math.max(...aumTimeline.map(x=>x.aum))).label} />
          </div>
        </Card>

        {/* ===================== MONTHLY METRIC EXPLORER ===================== */}
        <Card style={{ paddingBottom:18 }}>
          <SectionTitle dot={C.navy}>สำรวจตัวชี้วัดรายเดือน — ปี {selectedYear}</SectionTitle>
          <div style={{ display:"flex", gap:8, flexWrap:"wrap", marginBottom:14 }}>
            {[
              ["credit","เครดิต", C.blue],
              ["commission","ค่าตอบแทน", C.green],
              ["policies","กรมธรรม์", C.navy],
            ].map(([key,label,color])=>(
              <button key={key} onClick={()=>setMetric(key)} style={{
                padding:"7px 14px", borderRadius:10, fontSize:13, fontWeight:700, cursor:"pointer",
                border:`2px solid ${color}`,
                background: metric===key ? color : "transparent",
                color: metric===key ? C.white : color,
              }}>{label}</button>
            ))}
          </div>

          <div style={{ fontSize:14, fontWeight:700, color:C.navy, marginBottom:4 }}>{metricLabel}</div>
          <div style={{ width:"100%", height:250 }}>
            <ResponsiveContainer>
              <ComposedChart data={monthlyChartData} margin={{ top:6, right:8, left:-14, bottom:0 }}>
                <CartesianGrid stroke={C.skyLight} vertical={false} />
                <XAxis dataKey="month" tick={{ fontSize:12, fill:C.sub, fontWeight:600 }} axisLine={{stroke:C.skyLight}} tickLine={false} interval={0}/>
                <YAxis tick={{ fontSize:11, fill:C.sub }} tickFormatter={fmtCompact} axisLine={false} tickLine={false} width={50}/>
                {metric==="commission" ? (
                  <Tooltip content={({active,payload,label})=>{
                    if(!active||!payload||!payload.length) return null;
                    const row = monthlyChartData.find(r=>r.month===label);
                    if(!row) return null;
                    return (
                      <div style={{ background:C.navy, color:C.white, borderRadius:12, padding:"10px 14px", fontSize:13, fontWeight:600 }}>
                        <div style={{ fontWeight:800, marginBottom:4, color:C.skyLight }}>{label} {selectedYear}</div>
                        <div>รวม: ฿{fmt(row.commission)}</div>
                        {row.hasBreakdown ? (
                          <>
                            <div style={{ color:"#9FD3F0" }}>● สามัญ: ฿{fmt(row.commOrd)}</div>
                            <div style={{ color:"#B7E8C7" }}>● LBDU: ฿{fmt(row.commLbdu)}</div>
                          </>
                        ) : (
                          <div style={{ opacity:0.7, fontSize:11.5 }}>(ไม่มีข้อมูลแยกสามัญ/LBDU เดือนนี้)</div>
                        )}
                      </div>
                    );
                  }} />
                ) : (
                  <Tooltip content={<CustomTooltip />} />
                )}
                {metric==="credit" && <ReferenceLine y={yearSel.quota} stroke={C.amber} strokeDasharray="5 4" label={{ value:"โควต้า", fontSize:11, fill:C.amber, position:"insideTopRight" }} />}
                {metric==="commission" && <Bar key="commOrd" dataKey="commOrd" name="สามัญ" stackId="c" fill={C.blue} radius={[0,0,0,0]} maxBarSize={30} />}
                {metric==="commission" && <Bar key="commLbdu" dataKey="commLbdu" name="LBDU" stackId="c" fill={C.green} radius={[8,8,0,0]} maxBarSize={30} />}
                {metric!=="commission" && <Bar key="single" dataKey={metric} name={metricLabel.split(" ")[0]} radius={[8,8,0,0]} maxBarSize={30}
                  fill={metric==="credit"?C.blue:C.navy} />}
              </ComposedChart>
            </ResponsiveContainer>
          </div>
          {metric==="commission" && (
            <div style={{ display:"flex", gap:16, marginTop:8, fontSize:12.5, fontWeight:700 }}>
              <span style={{ color:C.blue }}>■ สามัญ</span>
              <span style={{ color:C.green }}>■ LBDU</span>
            </div>
          )}
        </Card>

        {/* ===================== MONTHLY TABLE ===================== */}
        <Card>
          <SectionTitle dot={C.blue}>ตารางรายเดือน ปี {selectedYear}</SectionTitle>
          <div style={{ overflowX:"auto", marginBottom:14 }}>
            <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13.5, minWidth:620 }}>
              <thead>
                <tr style={{ background:C.skyLight }}>
                  {["เดือน","เครดิต","ราย","เบี้ย","%เทียบโควต้า","ตรง/ทีม30%","ค่าตอบแทน"].map((h,i)=>(
                    <th key={i} style={{ padding:"9px 8px", textAlign: i===0?"left":"right", color:C.navy, fontWeight:800, whiteSpace:"nowrap" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {yearSel.m.map((row,i)=> row ? (
                  <tr key={i} style={{ borderBottom:`1px solid ${C.skyPale}`, background: i%2? C.greenPale : C.white }}>
                    <td style={{ padding:"8px", fontWeight:700, color:C.navy }}>{MONTHS[i]}</td>
                    <td style={{ padding:"8px", textAlign:"right", fontWeight:700 }}>{fmt(row[0])}</td>
                    <td style={{ padding:"8px", textAlign:"right" }}>{row[1]||"-"}</td>
                    <td style={{ padding:"8px", textAlign:"right" }}>{fmt(row[3])}</td>
                    <td style={{ padding:"8px", textAlign:"right", fontWeight:700, color: row[4]==null?C.sub:(row[4]>=0?C.green:C.red) }}>
                      {row[4]==null? "-" : (row[4]>=0?"+":"")+fmt(row[4],1)+"%"}
                    </td>
                    <td style={{ padding:"8px", textAlign:"right", fontSize:12, color:C.sub }}>
                      {row[7]!=null ? `${Math.round(row[7]/(row[7]+row[8])*100)}/${Math.round(row[8]/(row[7]+row[8])*100)}` : "-"}
                    </td>
                    <td style={{ padding:"8px", textAlign:"right", fontWeight:700, color:C.blue }}>
                      {fmt(row[6])}
                      {row[9]!=null && (
                        <div style={{ fontSize:10.5, fontWeight:600, color:C.sub, marginTop:2 }}>
                          สามัญ {fmt(row[9])} / LBDU {fmt(row[10])}
                        </div>
                      )}
                    </td>
                  </tr>
                ) : (
                  <tr key={i} style={{ borderBottom:`1px solid ${C.skyPale}` }}>
                    <td style={{ padding:"8px", color:C.sub }}>{MONTHS[i]}</td>
                    <td colSpan={6} style={{ padding:"8px", textAlign:"center", color:C.sub }}>ยังไม่มีข้อมูล</td>
                  </tr>
                ))}
              </tbody>
              <tfoot>
                <tr style={{ background:C.navy, color:C.white }}>
                  <td style={{ padding:"9px 8px", fontWeight:800 }}>รวม</td>
                  <td style={{ padding:"9px 8px", textAlign:"right", fontWeight:800 }}>{fmt(selSummary.credit)}</td>
                  <td style={{ padding:"9px 8px", textAlign:"right", fontWeight:800 }}>{fmt(selSummary.policies)}</td>
                  <td style={{ padding:"9px 8px", textAlign:"right", fontWeight:800 }}>{fmt(selSummary.premium)}</td>
                  <td style={{ padding:"9px 8px", textAlign:"right", fontWeight:800 }}>{(selSummary.pct>=0?"+":"")+fmt(selSummary.pct,1)+"%"}</td>
                  <td style={{ padding:"9px 8px", textAlign:"right", fontWeight:800, fontSize:12 }}>
                    {Math.round(selSummary.direct/(selSummary.direct+selSummary.team30)*100)}/{Math.round(selSummary.team30/(selSummary.direct+selSummary.team30)*100)}
                  </td>
                  <td style={{ padding:"9px 8px", textAlign:"right", fontWeight:800 }}>
                    {fmt(selSummary.commission)}
                    <div style={{ fontSize:10.5, fontWeight:600, color:C.skyLight, marginTop:2 }}>
                      สามัญ {fmt(selSummary.commOrd)} / LBDU {fmt(selSummary.commLbdu)}
                    </div>
                  </td>
                </tr>
              </tfoot>
            </table>
          </div>
        </Card>

        <div style={{ textAlign:"center", fontSize:12, color:C.sub, padding:"6px 0 20px", lineHeight:1.7 }}>
          ข้อมูลจากเอกสาร "เครดิตผลงานและผลประโยชน์ค่าตอบแทนผู้บริหารหน่วย" ปี 2558–2569 (ณ วันที่พิมพ์ 14/08/2569)<br/>
          หมายเหตุ: ราย/ทุน/เบี้ย คือผลงานตัวแทนตรงของป้าเป็ด · เครดิตและค่าตอบแทนรวมเป็นตัวเลขระดับหน่วย · AUM มาจากธุรกิจกองทุนรวม แยกจากผลงานประกัน<br/>
          <span style={{ fontWeight:700, color:C.navy }}>เวอร์ชัน {APP_VERSION}</span> · อัปเดตล่าสุด {BUILD_DATE}
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>
</body>
</html>
